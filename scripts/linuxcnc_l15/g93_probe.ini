# L1.5 探针 INI — 基于官方 configs/sim/axis/axis.ini (2.9) 改制
# 改动: mm 单位 / 限值放大 / 附加 sampler 采集 HALFILE / 去 spindle_encoder+cooling+constraints
# 依赖的发行版自带文件: core_sim.hal / simulated_home.hal / axis_manualtoolchange.hal
# 运行: 在本目录 `linuxcnc g93_probe.ini` (WSLg)

[EMC]
VERSION = 1.1
MACHINE = L15-G93-PROBE
DEBUG = 0

[DISPLAY]
DISPLAY = axis
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 1.0
MAX_LINEAR_VELOCITY = 250
DEFAULT_LINEAR_VELOCITY = 10
PROGRAM_PREFIX = .
INTRO_TIME = 1

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = g93_probe.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = g93_probe.tbl
TOOL_CHANGE_POSITION = 0 0 0
TOOL_CHANGE_QUILL_UP = 1

[HAL]
HALFILE = core_sim.hal
HALFILE = simulated_home.hal
HALFILE = axis_manualtoolchange.hal
HALFILE = g93_probe.hal
HALUI = halui

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 250
DEFAULT_LINEAR_ACCELERATION = 5000
MAX_LINEAR_ACCELERATION = 5000
POSITION_FILE = position.txt

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MAX_VELOCITY = 200
MAX_ACCELERATION = 2000
MIN_LIMIT = -210
MAX_LIMIT = 210

[AXIS_Y]
MAX_VELOCITY = 200
MAX_ACCELERATION = 2000
MIN_LIMIT = -210
MAX_LIMIT = 210

[AXIS_Z]
MAX_VELOCITY = 200
MAX_ACCELERATION = 2000
MIN_LIMIT = -210
MAX_LIMIT = 210

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 250
MAX_ACCELERATION = 2000
BACKLASH = 0.0
INPUT_SCALE = 4000
OUTPUT_SCALE = 1.0
FERROR = 2.0
MIN_FERROR = 0.2
MIN_LIMIT = -210
MAX_LIMIT = 210
HOME_OFFSET = 0.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 1

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 250
MAX_ACCELERATION = 2000
BACKLASH = 0.0
INPUT_SCALE = 4000
OUTPUT_SCALE = 1.0
FERROR = 2.0
MIN_FERROR = 0.2
MIN_LIMIT = -210
MAX_LIMIT = 210
HOME_OFFSET = 0.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 1

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 250
MAX_ACCELERATION = 2000
BACKLASH = 0.0
INPUT_SCALE = 4000
OUTPUT_SCALE = 1.0
FERROR = 2.0
MIN_FERROR = 0.2
MIN_LIMIT = -210
MAX_LIMIT = 210
HOME_OFFSET = 0.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 0
